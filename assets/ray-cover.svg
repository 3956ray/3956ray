<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Ray — Blockchain Engineer</title>
  <desc id="desc">A minimal dark editorial cover with a circuit-inspired network graphic, representing protocol engineering, security, and products.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1420"/>
      <stop offset="100%" stop-color="#122B3C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#62E4C4"/>
      <stop offset="100%" stop-color="#85A4FF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#B1D5E8" stroke-opacity=".085" stroke-width="1"/>
    </pattern>
    <clipPath id="clip">
      <rect width="1200" height="320" rx="22"/>
    </clipPath>
  </defs>
  <g clip-path="url(#clip)">
