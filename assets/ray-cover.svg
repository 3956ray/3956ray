    <path d="M0 0 H1200" stroke="#A5C6D8" stroke-opacity=".15"/>
    <path d="M65 82 H305" stroke="url(#accent)" stroke-width="2"/>
    <text x="68" y="66" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="4" fill="#99B9CB">BUILD / VERIFY / SHIP</text>
    <text x="60" y="194" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="116" font-weight="700" letter-spacing="-8" fill="#F2F7FB">ray<tspan fill="#62E4C4">.</tspan></text>
    <text x="69" y="243" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" letter-spacing="3.2" fill="#EDF5FA">BLOCKCHAIN ENGINEER</text>
    <text x="70" y="278" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="17" fill="#9FB8C9">Protocols  /  Security  /  Products</text>
    <g transform="translate(962 159)">
