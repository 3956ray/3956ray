      <circle r="108" fill="none" stroke="#8EACBF" stroke-opacity=".25"/>
      <circle r="68" fill="none" stroke="url(#accent)" stroke-opacity=".77" stroke-width="1.7"/>
      <path d="M-188 0 H188 M0 -157 V157 M-136 -91 L137 92 M-129 99 L122 -94" stroke="#8BACBC" stroke-opacity=".22" stroke-width="1.3"/>
      <path d="M-108 -9 L-52 -44 L6 0 L74 -30 L127 14 M-61 103 L0 69 L79 107" fill="none" stroke="url(#accent)" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-108" cy="-9" r="6" fill="#62E4C4"/>
      <circle cx="-52" cy="-44" r="6" fill="#85A4FF"/>
      <circle cx="6" cy="0" r="10" fill="#122B3C" stroke="#62E4C4" stroke-width="3"/>
      <circle cx="74" cy="-30" r="7" fill="#62E4C4"/>
